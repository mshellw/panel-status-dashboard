<!DOCTYPE html>
<html>
<head>
  <title>Panel Assembly Status</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { margin: 0; padding: 20px; font-family: system-ui, -apple-system, sans-serif; background: #f5f5f5; }
    .container { max-width: 700px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; }
    svg { max-width: 100%; height: auto; display: block; }
    .refresh-info { text-align: center; color: #666; font-size: 13px; margin-top: 20px; }
  </style>
</head>
<body>
  <div class="container">
    <div id="content"></div>
    <div class="refresh-info">
      ⟳ Last updated: <span id="updated">loading...</span><br>
      This page refreshes hourly
    </div>
  </div>

<script>
  setInterval(() => {
    document.getElementById('content').innerHTML = '';
    fetch('panel-grid.svg?t=' + Date.now())
      .then(r => r.text())
      .then(svg => {
        document.getElementById('content').innerHTML = svg;
      });
  }, 5 * 60 * 1000);
</script>
  
</body>
</html>
