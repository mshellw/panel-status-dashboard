<!DOCTYPE html>
<html>
<head>
  <title>Panel Assembly Status</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { margin: 0; padding: 20px; font-family: sans-serif; background: #f5f5f5; }
    h1 { text-align: center; color: #1f2937; }
    .container { max-width: 600px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; }
    svg { max-width: 100%; height: auto; }
    .stats { text-align: center; margin-top: 20px; font-size: 14px; }
    .refresh-notice { text-align: center; color: #666; font-size: 12px; margin-top: 10px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>218 Madison Panel Progress</h1>
    <div id="grid"></div>
    <div class="refresh-notice">⟳ Refreshing every 5 seconds...</div>
  </div>

  <script>
    const BASE_ID = 'appPMuMIKkuahUkmG';
    const TABLE_NAME = 'ACTIVE Panels';
    const AIRTABLE_TOKEN = 'YOUR_AIRTABLE_PAT_TOKEN';

    async function fetchPanels() {
      try {
        const response = await fetch(
          `https://api.airtable.com/v0/${BASE_ID}/${TABLE_NAME}?fields=ID,Type,Cut`,
          {
            headers: { Authorization: `Bearer ${AIRTABLE_TOKEN}` }
          }
        );
        const data = await response.json();
        return data.records || [];
      } catch (error) {
        console.error('Error fetching panels:', error);
        return [];
      }
    }

    async function renderGrid() {
      const records = await fetchPanels();
      const panels = records.map(r => ({
        id: r.fields.ID,
        type: r.fields.Type,
        cut: !!r.fields.Cut
      }));

      const total = panels.length;
      const cut = panels.filter(p => p.cut).length;
      const percentage = total > 0 ? Math.round((cut / total) * 100) : 0;

      // Parse row/column
      const panelData = panels.map(p => {
        const match = (p.id || '').match(/^(\d+)-(\d+)/);
        const [, row, col] = match || ['', '0', '0'];
        return { ...p, row: parseInt(row), col: parseInt(col) };
      });

      // Render SVG (same as before)
      const svgContent = renderSVG(panelData, cut, total, percentage);
      document.getElementById('grid').innerHTML = svgContent;
    }

    function renderSVG(panelData, cut, total, percentage) {
      // SVG rendering logic (same as block code above)
      return `<svg viewBox="0 0 500 1100">
        <!-- Title -->
        <text x="250" y="20" style="font-size: 16px; font-weight: 500; text-anchor: middle; fill: #1f2937;">
          218 Madison — Panel Assembly Status
        </text>
        <text x="250" y="35" style="font-size: 12px; text-anchor: middle; fill: #6b7280;">
          ${cut} / ${total} assembled (${percentage}%)
        </text>
        
        <!-- Panels grid (simplified) -->
        ${Array.from({ length: 12 }, (_, i) => 12 - i)
          .map((row) =>
            Array.from({ length: 7 }, (_, i) => i + 1)
              .map((col) => {
                const panel = panelData.find(p => p.row === row && p.col === col);
                const fill = panel?.cut ? '#22c55e' : '#ffffff';
                const stroke = panel?.cut ? '#16a34a' : '#d1d5db';
                const x = 50 + col * 60;
                const y = 92 + (12 - row) * 58;
                return `<rect x="${x}" y="${y}" width="20" height="48" fill="${fill}" stroke="${stroke}" stroke-width="1"/>
                        <text x="${x + 10}" y="${y + 24}" style="font-size: 9px; text-anchor: middle; fill: #000; font-weight: 500;">${row}-${col}</text>`;
              })
              .join('')
          )
          .join('')}
      </svg>`;
    }

    // Refresh every 5 seconds
    renderGrid();
    setInterval(renderGrid, 5000);
  </script>
</body>
</html>
